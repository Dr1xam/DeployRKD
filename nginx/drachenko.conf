# ============================================================================
# Nginx Reverse Proxy Configuration
# Student: drachenko (Index 0)
# Location on VM: /etc/nginx/sites-available/drachenko
# Symlink on VM: /etc/nginx/sites-enabled/drachenko
# ============================================================================

server {
    listen 8080;   # Nginx public port from PORTS.md (Student 0: 8080)

    location / {
        proxy_pass http://127.0.0.1:5000;   # Backend API_PORT from PORTS.md (Student 0: 5000)

        # --- Request Headers forwarded to Backend ---
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- Security Response Headers sent to Client ---
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }
}
